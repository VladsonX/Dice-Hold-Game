<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Pig Game</title>
  </head>
  <body>
    <main>
      <section id="menu" class="menu">
        <div class="menu__wrapper">
          <div class="menu__text-wrapper">
            <h1 class="menu__title">Dice Game</h1>
            <p class="menu__descr">
              Welcome to the classic 2-player Dice Duel. Enter your nicknames
              below and let the dice decide the winner!
            </p>
          </div>
          <div class="menu__login-wrapper">
            <form id="logIn" class="menu__logIn">
              <div class="menu__player-wrapper">
                <label class="menu__label" for="player1Name">Player 1:</label>
                <input
                  placeholder="Player 1"
                  maxlength="16"
                  required
                  class="menu__input"
                  id="player1Name"
                  type="text"
                />
              </div>
              <div class="menu__player-wrapper">
                <label class="menu__label" for="player1Name">Player 1:</label>
                <input
                  placeholder="Player 2"
                  maxlength="16"
                  required
                  class="menu__input"
                  id="player2Name"
                  type="text"
                />
              </div>
            </form>
            <div class="dice-wrapper">
              <div class="dice dice_menu dice_1">
                <div class="dice__row dice__row_1">
                  <div class="dice__dot dice__dot_1"></div>
                  <div class="dice__dot dice__dot_2"></div>
                </div>
                <div class="dice__row dice__row_2 center">
                  <div class="dice__dot dice__dot_3 display"></div>
                  <div class="dice__dot dice__dot_4"></div>
                </div>
                <div class="dice__row dice__row_3">
                  <div class="dice__dot dice__dot_5"></div>
                  <div class="dice__dot dice__dot_6"></div>
                </div>
              </div>
            </div>
          </div>
          <button form="logIn" type="submit" class="button button_play">
            Start game
          </button>
        </div>
      </section>
      <section id="playground" class="playground dnone">
        <div class="player player--0 player--active">
          <h2 class="name" id="name--0">Player 1</h2>
          <p class="score" id="score--0">0</p>
          <div class="current">
            <p class="current-label">Current</p>
            <p class="current-score" id="current--0">0</p>
          </div>
        </div>
        <div class="player player--1">
          <h2 class="name" id="name--1">Player 2</h2>
          <p class="score" id="score--1">0</p>
          <div class="current">
            <p class="current-label">Current</p>
            <p class="current-score" id="current--1">0</p>
          </div>
        </div>
        <div id="dice" class="dice dnone">
          <div class="dice__row dice__row_1">
            <div class="dice__dot dice__dot_1"></div>
            <div class="dice__dot dice__dot_2"></div>
          </div>
          <div class="dice__row dice__row_2 center">
            <div class="dice__dot dice__dot_3 display"></div>
            <div class="dice__dot dice__dot_4"></div>
          </div>
          <div class="dice__row dice__row_3">
            <div class="dice__dot dice__dot_5"></div>
            <div class="dice__dot dice__dot_6"></div>
          </div>
        </div>
        <button class="btn btn--quit">Main Menu (ESC)</button>
        <button class="btn btn--new">New game (R)</button>
        <button class="btn btn--roll">Roll dice (ENT)</button>
        <button class="btn btn--hold">Hold (SPC)</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
